<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Inbox - DemoMail</title>
<style>
*{box-sizing:border-box} body{margin:0;font:14px/1.45 "Segoe UI",system-ui,Arial,sans-serif;color:#1f2330;background:#f3f5f9}
header{height:56px;display:flex;align-items:center;gap:14px;padding:0 20px;background:#fff;border-bottom:1px solid #e3e6ee}
header b{font-size:19px;color:#2f4fb8} header input{flex:1;max-width:520px;border:0;background:#eef1f7;border-radius:8px;padding:9px 12px;font:inherit}
.wrap{display:flex;height:calc(100vh - 56px)} nav{width:190px;padding:14px 10px}
nav div{padding:8px 12px;border-radius:0 16px 16px 0;color:#444b5c} nav .on{background:#dfe6fb;color:#1c3a99;font-weight:600}
.list{width:400px;background:#fff;border-right:1px solid #e3e6ee;overflow:auto}
.row{padding:12px 16px;border-bottom:1px solid #eef0f5;cursor:pointer} .row:hover{background:#f6f8fd} .row.sel{background:#e9eefc}
.row .f{display:flex;justify-content:space-between;font-weight:600} .row .f small{font-weight:400;color:#7a8091}
.row .s{font-weight:600;font-size:13px} .row .p{color:#6b7182;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.read{flex:1;background:#fff;padding:24px 32px;overflow:auto} .empty{color:#8a90a0;margin-top:120px;text-align:center}
.read h1{font-size:21px;margin:0 0 12px} .who{display:flex;gap:10px;align-items:center;margin-bottom:6px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.who small{color:#6b7182} .tools{display:flex;gap:8px;margin:10px 0 18px} .tools button{border:1px solid #d6dae4;background:#fff;border-radius:16px;padding:5px 14px;font:inherit}
.message-body{max-width:640px}
</style></head>
<body><header><b>DemoMail</b><input placeholder="Search mail" aria-label="Search mail"></header>
<div class="wrap"><nav><div class="on">Inbox</div><div>Starred</div><div>Sent</div><div>Drafts</div></nav>
<div class="list" id="list"></div><div class="read" role="main" id="read"><div class="empty">Select an email to read</div></div></div>
<script>
const MAILS = [
  { id: "finaid", name: "Alabama A&M University Financial Aid", email: "financialaid@aamu-support.com", time: "9:41 AM", color: "#b0413e",
    subject: "URGENT: Verify Your Financial Aid Information",
    body: 'Dear Student,<br><br>Your financial aid account requires immediate verification. Click below within 24 hours to prevent your account from being suspended.<br><br><a href="http://aamu-support.com/finaid/verify-login">Verify Your Account</a><br><br>Thank you,<br>AAMU Financial Aid Office' },
  { id: "rewards", name: "Campus Rewards", email: "rewards@studentperks.net", time: "8:15 AM", color: "#c27c0e",
    subject: "You have unclaimed points",
    body: "You have 2,400 unclaimed student reward points. Visit studentperks.net to redeem them before they expire." },
  { id: "reed", name: "Dr. Monica Reed", email: "monica.reed@aamu.edu", time: "Yesterday", color: "#2e7d5b",
    subject: "Re: CS410 homework question",
    body: "Hi,<br><br>Good question. For part B you only need the time complexity analysis. I'll clarify in class Tuesday.<br><br>Best,<br>Dr. Reed" },
];
const strip = h => h.replace(/<[^>]+>/g, " ");
document.getElementById("list").innerHTML = MAILS.map(m => '<div class="row" data-id="' + m.id + '"><div class="f">' + m.name + "<small>" + m.time + '</small></div><div class="s">' + m.subject + '</div><div class="p">' + strip(m.body) + "</div></div>").join("");
document.querySelectorAll(".row").forEach(r => r.onclick = () => { location.hash = r.dataset.id; });
function render() {
  const m = MAILS.find(x => x.id === location.hash.slice(1));
  document.querySelectorAll(".row").forEach(r => r.classList.toggle("sel", !!m && r.dataset.id === m.id));
  document.getElementById("read").innerHTML = !m ? '<div class="empty">Select an email to read</div>' :
    "<h1>" + m.subject + '</h1><div class="who"><div class="av" style="background:' + m.color + '">' + m.name[0] + "</div><div><b title=\"" + m.email + "\">" + m.name + "</b> <small>&lt;" + m.email + "&gt;</small><br><small>to me · " + m.time + "</small></div></div>" +
    '<div class="tools"><button>Reply</button><button>Forward</button></div><div class="message-body">' + m.body + "</div>";
}
window.addEventListener("hashchange", render); render();
</script></body></html>
