<main class="page">
  <header class="hero">
    <h1>Campus<span>Guard</span></h1>
    <p>Paste anything that feels off. Find out if it's a scam.</p>
  </header>

  <div class="slot-hero" id="slot-hero">
    <div class="box" id="box">
      <div class="thumbs" id="thumbs"></div>
      <textarea id="content" rows="3" spellcheck="false" aria-label="Message, link or screenshot to check" placeholder="Paste a message, a link, or drop a screenshot"></textarea>
      <div class="box-foot">
        <button type="button" class="attach" id="attach" aria-label="Add a screenshot or image" title="Add a screenshot"><svg class="ico"><use href="#h-clip"/></svg></button>
        <input type="file" id="file" accept="image/*" multiple hidden>
        <span class="hint">Enter to check · Shift + Enter for a new line</span>
      </div>
      <div class="dock-view" aria-hidden="true"><div style="min-width:0"><small>You pasted</small><span class="t" id="dock-text"></span></div><span class="edit"><svg class="ico"><use href="#h-pen"/></svg></span></div>
    </div>
    <div class="go-wrap" id="go-wrap"><button type="button" class="go" id="go">Check it <svg class="ico"><use href="#h-arrow"/></svg></button></div>
  </div>

  <section class="results" id="results" hidden aria-live="polite"></section>
</main>

<button type="button" class="theme motion" id="motion" aria-label="Turn animations on or off" aria-pressed="true">
  <svg class="ico on"><use href="#h-spark"/></svg><svg class="ico off"><use href="#h-nospark"/></svg>
</button>
<button type="button" class="theme" id="theme" aria-label="Switch between light and dark mode" title="Light / dark">

</button>
